<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Crazy Fantasy</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<!-- HERO -->
<section class="hero">
  <img src="assets/images/banner.jpg" alt="Crazy Fantasy">
</section>

<!-- QUIZ -->
<div class="quiz">
  <button data-target="bad">💀 Impactar</button>
  <button data-target="fun">😄 Divertir</button>
  <button data-target="pop">⚡ Brilhar</button>
  <button data-target="luxo">👑 Luxo</button>
</div>

<!-- BUSCA -->
<section class="search-overlay">
  <div class="search-box">
    <input type="text" id="busca" placeholder="Buscar fantasia...">

    <div class="filters">
      <select id="filtroTamanho">
        <option value="">Tamanho</option>
        <option value="P">P</option>
        <option value="M">M</option>
        <option value="G">G</option>
      </select>

      <select id="filtroPreco">
        <option value="">Preço</option>
        <option value="100">Até R$100</option>
        <option value="200">Até R$200</option>
      </select>
    </div>
  </div>
</section>

<!-- CATEGORIAS -->
<section class="categorias container">
  <div class="cat"><img src="assets/images/cat-bad.jpg"></div>
  <div class="cat"><img src="assets/images/cat-fun.jpg"></div>
  <div class="cat"><img src="assets/images/cat-pop.jpg"></div>
  <div class="cat"><img src="assets/images/cat-luxo.jpg"></div>
</section>

<!-- PRODUTOS -->
<section id="bad"><div class="grid"></div></section>
<section id="fun"><div class="grid"></div></section>
<section id="pop"><div class="grid"></div></section>
<section id="luxo"><div class="grid"></div></section>

<!-- MODAL -->
<div id="modal" class="hidden">
  <div class="modal-content">

    <span class="close">&times;</span>

    <div class="modal-body">

      <div class="modal-img">
        <img id="modal-img">
      </div>

      <div class="modal-info">

        <h3 id="modal-nome"></h3>

        <p id="modal-preco" class="modal-preco"></p>
        <p id="modal-tamanhos"></p>

        <div class="divider"></div>

        <div class="modal-actions">
          <a id="modal-whatsapp" target="_blank">Consultar disponibilidade</a>
          <button id="btn-upsell">Completar look</button>
        </div>

        <div id="upsell"></div>

      </div>

    </div>
  </div>
</div>

<!-- FOOTER -->
<footer>
  <div class="footer-grid container">
    <div>✨ Fantasias Premium</div>
    <div>🧼 Higienização Profissional</div>
    <div>💬 Atendimento via WhatsApp</div>
    <div>🎯 Atendimento Personalizado</div>
  </div>
</footer>

<script src="js/script.js"></script>

</body>
</html>
