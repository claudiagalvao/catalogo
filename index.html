<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Crazy Fantasy | Catálogo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<section class="hero">
  <img src="assets/images/banner.jpg" alt="Crazy Fantasy Banner">
</section>

<nav class="quiz container">
  <button data-target="bad">💀 Impactar</button>
  <button data-target="fun">😄 Divertir</button>
  <button data-target="pop">⚡ Brilhar</button>
  <button data-target="luxo">👑 Luxo</button>
</nav>

<section class="search-overlay container">
  <div class="search-box">
    <input type="text" id="busca" placeholder="Buscar fantasia...">
    <div class="filters">
      <select id="filtroTamanho">
        <option value="">Tamanho</option>
        <option value="P">P</option><option value="M">M</option><option value="G">G</option>
      </select>
      <select id="filtroPreco">
        <option value="">Preço</option>
        <option value="100">Até R$100</option>
        <option value="200">Até R$200</option>
      </select>
    </div>
  </div>
</section>

<main class="container">
  <section id="bad" class="cat-section"><h2>💀 Impactar</h2><div class="grid"></div></section>
  <section id="fun" class="cat-section"><h2>😄 Divertir</h2><div class="grid"></div></section>
  <section id="pop" class="cat-section"><h2>⚡ Brilhar</h2><div class="grid"></div></section>
  <section id="luxo" class="cat-section"><h2>👑 Luxo</h2><div class="grid"></div></section>
</main>

<div id="modal" class="hidden">
  <div class="modal-content">
    <span class="close">&times;</span>
    <div class="modal-body">
      <div class="modal-img"><img id="modal-img" src=""></div>
      <div class="modal-info">
        <h3 id="modal-nome"></h3>
        <p id="modal-preco" class="modal-p"></p>
        <p id="modal-tamanhos"></p>
        <div class="divider"></div>
        <div id="upsell"></div>
        <div class="modal-actions">
          <button id="btn-upsell">🔥 Reservar Look Completo</button>
          <a id="modal-whatsapp" target="_blank">Consultar Disponibilidade</a>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="js/script.js"></script>
</body>
</html>
