<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Crazy Fantasy | Monte Seu Look. Cause Impacto.</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="hero-banner">
  <img src="assets/images/banner_principal.jpg" alt="Crazy Fantasy Banner">
</header>

<section class="vibe-section container">
  <h2>QUAL VIBE VOCÊ QUER HOJE?</h2>
  
  <nav class="vibe-grid">
    <button class="vibe-btn active" data-vibe="impactar">
      <img src="assets/images/icon_skull.png" alt="Impactar">
      <div class="vibe-text">
        <strong>IMPACTAR</strong>
        <span>Chegue chegando</span>
      </div>
    </button>

    <button class="vibe-btn" data-vibe="divertir">
      <img src="assets/images/icon_fun.png" alt="Divertir">
      <div class="vibe-text">
        <strong>DIVERTIR</strong>
        <span>Alegria garantida</span>
      </div>
    </button>

    <button class="vibe-btn" data-vibe="brilhar">
      <img src="assets/images/icon_lightning.png" alt="Brilhar">
      <div class="vibe-text">
        <strong>BRILHAR</strong>
        <span>Seja o centro</span>
      </div>
    </button>

    <button class="vibe-btn" data-vibe="luxo">
      <img src="assets/images/icon_crown.png" alt="Luxo">
      <div class="vibe-text">
        <strong>LUXO</strong>
        <span>Sofisticação pura</span>
      </div>
    </button>
  </nav>
</section>

<section class="search-section container">
  <h2>BUSCAR FANTASIA</h2>
  
  <div class="search-controls">
    <div class="search-bar">
      <input type="text" id="busca_fantasia" placeholder="Nome do personagem, tema...">
      <img src="assets/images/icon_search.png" alt="Buscar">
    </div>

    <div class="search-filters">
      <select id="filtro_tamanho">
        <option value="">TAMANHO</option>
        <option value="p">P</option><option value="m">M</option><option value="g">G</option>
      </select>
      <select id="filtro_preco">
        <option value="">PREÇO</option>
        <option value="100">Até R$100</option>
        <option value="200">Até R$200</option>
      </select>
    </div>
  </div>
</section>

<section class="collections-section container">
  <div class="collections-grid">
    <a href="#" class="collection-card" data-collection="bad">
      <img src="assets/images/cat-bad.jpg" alt="Bad & Dark Collection">
    </a>
    <a href="#" class="collection-card" data-collection="fun">
      <img src="assets/images/cat-fun.jpg" alt="Fun & Party Collection">
    </a>
    <a href="#" class="collection-card" data-collection="pop">
      <img src="assets/images/cat-pop.jpg" alt="Pop Culture Collection">
    </a>
    <a href="#" class="collection-card" data-collection="luxo">
      <img src="assets/images/cat-luxo.jpg" alt="Luxo & Glam Collection">
    </a>
  </div>
</section>

<main class="container">
    <div id="product-grid" class="product-grid">
        </div>
</main>

<footer class="main-footer">
    <img src="assets/images/footer_diferenciais.jpg" alt="Nossos Diferenciais">
</footer>

<div id="modal" class="hidden">
    </div>

<script src="js/script.js"></script>
</body>
</html>
