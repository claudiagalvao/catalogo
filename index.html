<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Crazy Fantasy</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<!-- HERO -->
<section class="hero"></section>

<!-- QUIZ -->
<div class="quiz">
  <button data-target="bad" class="impactar">💀 Impactar</button>
  <button data-target="fun" class="divertir">😄 Divertir</button>
  <button data-target="pop" class="brilhar">⚡ Brilhar</button>
  <button data-target="luxo" class="luxo">👑 Luxo</button>
</div>

<!-- BUSCA -->
<section class="search-overlay">
  <div class="search-box">
    <input type="text" id="busca" placeholder="Buscar fantasia...">
    <select id="filtroTamanho">
      <option value="">Tamanho</option>
      <option value="P">P</option>
      <option value="M">M</option>
      <option value="G">G</option>
    </select>
    <select id="filtroPreco">
      <option value="">Preço</option>
      <option value="100">Até R$100</option>
      <option value="200">Até R$200</option>
    </select>
  </div>
</section>

<!-- PRODUTOS -->
<section id="bad"><div class="grid" id="grid"></div></section>

<!-- MODAL -->
<div id="modal" class="hidden">
  <div class="modal-content">

    <span class="close" onclick="fecharModal()">✖</span>

    <div class="modal-body">
      <img id="modal-img">

      <div class="modal-info">
        <h3 id="modal-nome"></h3>
        <p id="modal-preco"></p>

        <a id="modal-whatsapp" class="btn" target="_blank">
          Falar no WhatsApp
        </a>

        <div id="upsell"></div>
      </div>
    </div>

  </div>
</div>

<!-- FOOTER -->
<footer class="footer">
  <div class="footer-grid">
    <div>✨ Fantasias Premium</div>
    <div>🧼 Higienização Profissional</div>
    <div>💬 Atendimento via WhatsApp</div>
    <div>🎯 Atendimento Personalizado</div>
  </div>
</footer>

<script src="js/script.js"></script>
</body>
</html>
