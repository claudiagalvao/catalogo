<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Crazy Fantasy | Catálogo 2026</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="hero-banner">
    <img src="assets/images/hero-banner.jpg" alt="Crazy Fantasy">
</header>

<section class="search-filter-container container">
    <div class="search-box">
        <i class="fa fa-search"></i>
        <input type="text" id="input-busca" placeholder="Buscar fantasia...">
    </div>
    <div class="filter-box">
        <select id="filter-tamanho">
            <option value="">Tamanho</option>
            <option value="PP">PP</option>
            <option value="P">P</option>
            <option value="M">M</option>
            <option value="G">G</option>
            <option value="GG">GG</option>
        </select>
    </div>
</section>

<main class="container">
    <div id="product-grid" class="product-grid"></div>
</main>

<div id="modal" class="modal hidden">
    <div class="modal-content">
        <span class="close">&times;</span>
        <div class="modal-layout">
            <div class="modal-left"><img id="modal-img" src=""></div>
            <div class="modal-right">
                <h3 id="modal-nome"></h3>
                <div class="price-container">
                    <span id="modal-preco-atual" class="new-price"></span>
                </div>
                <div id="upsell-container" class="upsell-container">
                    <h4>🔥 ADICIONE ACESSÓRIOS:</h4>
                    <div id="upsell-list"></div>
                </div>
                <button id="btn-finalizar" class="btn-whatsapp-neon">
                    <i class="fab fa-whatsapp"></i> RESERVAR AGORA
                </button>
            </div>
        </div>
    </div>
</div>

<script src="js/script.js"></script>
</body>
</html>
