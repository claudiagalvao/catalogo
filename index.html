<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Crazy Fantasy</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<!-- HERO -->
<section class="hero"></section>

<!-- VIBE -->
<section class="vibe"></section>

<!-- QUIZ (AGORA NO LUGAR CERTO) -->
<div class="quiz">

  <button data-target="bad" class="impactar">💀 Impactar</button>
  <button data-target="fun" class="divertir">😄 Divertir</button>
  <button data-target="pop" class="brilhar">⚡ Brilhar</button>
  <button data-target="luxo" class="luxo">👑 Luxo</button>

</div>

<!-- BUSCA -->
<section class="search-overlay">
  <div class="search-box">

    <input type="text" id="busca" placeholder="Buscar fantasia...">

    <div class="filters">
      <select id="filtroTamanho">
        <option value="">Tamanho</option>
        <option value="P">P</option>
        <option value="M">M</option>
        <option value="G">G</option>
      </select>

      <select id="filtroPreco">
        <option value="">Preço</option>
        <option value="100">Até R$100</option>
        <option value="200">Até R$200</option>
      </select>
    </div>

  </div>
</section>

<!-- CATEGORIAS -->
<section class="categorias container">

  <div class="cat"><img src="assets/images/cat-bad.jpg"></div>
  <div class="cat"><img src="assets/images/cat-fun.jpg"></div>
  <div class="cat"><img src="assets/images/cat-pop.jpg"></div>
  <div class="cat"><img src="assets/images/cat-luxo.jpg"></div>

</section>

<!-- PRODUTOS -->
<section id="bad"><div class="grid"></div></section>
<section id="fun"><div class="grid"></div></section>
<section id="pop"><div class="grid"></div></section>
<section id="luxo"><div class="grid"></div></section>



<!-- MODAL -->
<div id="modal" class="modal hidden">
  <div class="modal-content">

    <span class="close">&times;</span>

    <div class="modal-body">

      <!-- IMAGEM -->
      <div class="modal-img">
        <img id="modal-img">
      </div>

      <!-- INFO -->
      <div class="modal-info">

        <h3 id="modal-nome"></h3>

        <p id="modal-preco" class="modal-preco"></p>
        <p id="modal-tamanhos"></p>

        <div class="divider"></div>

        <!-- BOTÕES -->
        <div class="modal-actions">
          <a id="modal-whatsapp" target="_blank" class="btn">
            Consultar disponibilidade
          </a>

          <button id="btn-upsell" class="btn secondary">
            Completar look
          </button>
        </div>

        <!-- UPSELL -->
        <div id="upsell"></div>

      </div>

    </div>

  </div>
</div>






  

<!-- FOOTER -->
<footer class="footer">
  <div class="footer-grid container">

    <div>✨ Fantasias Premium</div>
    <div>🧼 Higienização Profissional</div>
    <div>💬 Atendimento via WhatsApp</div>
    <div>🎯 Atendimento Personalizado</div>

  </div>
</footer>

<script src="js/script.js"></script>

</body>
</html>
