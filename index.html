<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Crazy Fantasy | Catálogo de Fantasias</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="hero-banner">
  <img src="assets/images/hero-banner.jpg" alt="Seja o Problema da Festa">
</header>

<nav class="vibe-section container">
  <h2>QUAL VIBE VOCÊ QUER HOJE?</h2>
  <div class="vibe-grid">
    <button class="vibe-btn active" data-vibe="impactar">
      <div class="vibe-text"><strong>IMPACTAR</strong><span>Chegue chegando</span></div>
    </button>
    <button class="vibe-btn" data-vibe="divertir">
      <div class="vibe-text"><strong>DIVERTIR</strong><span>Alegria garantida</span></div>
    </button>
    <button class="vibe-btn" data-vibe="brilhar">
      <div class="vibe-text"><strong>BRILHAR</strong><span>Seja o centro</span></div>
    </button>
    <button class="vibe-btn" data-vibe="luxo">
      <div class="vibe-text"><strong>LUXO</strong><span>Sofisticação pura</span></div>
    </button>
  </div>
</nav>

<section class="container">
  <div class="search-box">
    <input type="text" id="busca" placeholder="Buscar fantasia...">
  </div>
</section>

<section class="collections container">
  <div class="collections-grid">
    <img src="assets/images/cat-bad.jpg" class="col-img" data-vibe="impactar">
    <img src="assets/images/cat-fun.jpg" class="col-img" data-vibe="divertir">
    <img src="assets/images/cat-pop.jpg" class="col-img" data-vibe="brilhar">
    <img src="assets/images/cat-luxo.jpg" class="col-img" data-vibe="luxo">
  </div>
</section>

<main class="container">
  <div id="product-grid" class="product-grid">
    </div>
</main>

<footer class="main-footer">
  <div class="container">
    <img src="assets/images/footer-diferenciais.jpg" alt="Nossos Diferenciais" style="width:100%">
    <p>© 2026 Crazy Fantasy - Valinhos/SP</p>
  </div>
</footer>

<div id="modal" class="hidden">
  <div class="modal-content">
    <span class="close">&times;</span>
    <div class="modal-body">
      <div class="modal-img"><img id="modal-img" src=""></div>
      <div class="modal-info">
        <h3 id="modal-nome"></h3>
        <p id="modal-preco" class="modal-neon-price"></p>
        <p id="modal-tamanhos"></p>
        <div class="divider"></div>
        <div id="upsell"></div>
        <div class="modal-actions">
          <button id="btn-upsell">🔥 Reservar Look Completo</button>
          <a id="modal-whatsapp" target="_blank">Dúvidas via WhatsApp</a>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="js/script.js"></script>
</body>
</html>
